      el("span", { class: "grow" }, [
        el("b", { text: "#" + o.benId + " " + (b.nome || "") }),
        el("span", { class: "tiny muted", style: "display:block", text: o.categoria + " — recebidos " + o.recebidos + " de " + o.total })
      ]),
      el("span", { class: "tag st-INCOMPLETO", text: "Falta " + o.faltando })
    ]));
  });
  root.appendChild(c1);

  const semLocal = vols.filter(v => v.status !== "AGUARDANDO" && v.status !== "ENTREGUE" && !v.local);
  root.appendChild(el("h2", { class: "sec", text: "Recebidos sem local informado" }));
  const c2 = el("div", { class: "card" });
  if (!semLocal.length) c2.appendChild(el("div", { class: "card-pad small muted", text: "Todos os volumes recebidos têm local." }));
  semLocal.slice(0, 40).forEach(v => c2.appendChild(el("button", { class: "vrow", onclick: () => sheetConferencia(v) }, [
    el("span", { class: "cat-edge " + v.categoria, style: "min-height:30px" }),
    el("span", { class: "grow" }, [el("b", { text: "#" + v.benId + " " + ((state.ben[v.benKey] || {}).nome || v.benNome || "") }),
      el("span", { class: "tiny muted", style: "display:block", text: v.categoria + " · Vol " + v.volNum + "/" + v.volTotal })]),
    el("span", { class: "btn btn-sm", text: "Definir local" })
  ])));
  root.appendChild(c2);
}
function linhaMovimento(o) {
  return el("button", { class: "vrow", onclick: o.onClick }, [
    el("span", { style: "flex:none;width:22px;text-align:center;font-weight:700;font-size:16px;color:" + o.cor, text: o.seta }),
    el("span", { class: "grow" }, [
      el("b", { text: o.texto }),
      el("span", { class: "tiny muted", style: "display:block", text: o.sub })
    ]),
    el("span", { class: "tiny muted", text: fmtDT(o.hora) })
  ]);
}
function kpi(n, rot, cls) {
  return el("div", { class: "kpi " + (cls || "") }, [el("b", { text: String(n) }), el("span", { text: rot })]);
}

/* ------------------------------------------------------- REGISTRO RÁPIDO
   Pra anotar uma entrada ou saída avulsa em poucos toques, sem precisar
   navegar até um beneficiário específico — pensado pra quem está sozinho
   segurando a conferência inteira e não tem tempo de ficar procurando. */
function sheetMovimento(tipoInicial) {
  let tipo = tipoInicial || "ENTRADA";
  const body = el("div");

  const tipoRow = el("div", { class: "row", style: "margin-bottom:14px" });
  function desenhaTipo() {
    tipoRow.innerHTML = "";
    tipoRow.appendChild(el("button", {
      class: "chip", style: "flex:1;text-align:center;padding:11px", "aria-pressed": tipo === "ENTRADA",
      text: "↓ Entrada", onclick: () => { tipo = "ENTRADA"; desenhaTipo(); }
    }));
    tipoRow.appendChild(el("button", {
      class: "chip", style: "flex:1;text-align:center;padding:11px", "aria-pressed": tipo === "SAIDA",
      text: "↑ Saída", onclick: () => { tipo = "SAIDA"; desenhaTipo(); }
    }));
  }
  desenhaTipo();
  body.appendChild(tipoRow);

  const inDesc = el("input", { class: "inp inp-lg", placeholder: "Ex.: fralda G Huggies, leite Ninho…" });
  body.appendChild(el("div", { class: "field" }, [el("label", { class: "f", text: "O que é" }), inDesc]));

  const inQtd = el("input", { class: "inp", type: "number", min: "0", value: "1", inputmode: "numeric" });
  const inUnid = el("input", { class: "inp", placeholder: "un., kg, pacotes…" });
  body.appendChild(el("div", { class: "grid2 field" }, [
    el("div", {}, [el("label", { class: "f", text: "Quantidade" }), inQtd]),
    el("div", {}, [el("label", { class: "f", text: "Unidade (opcional)" }), inUnid])
  ]));

  const inBen = el("input", { class: "inp", inputmode: "numeric", placeholder: "Nº (opcional)" });
  const inNomeBen = el("input", { class: "inp", placeholder: "Nome (opcional)" });
  body.appendChild(el("div", { class: "grid2 field" }, [
    el("div", {}, [el("label", { class: "f", text: "Beneficiário (opcional)" }), inBen]),
    el("div", {}, [el("label", { class: "f", text: "Nome" }), inNomeBen])
  ]));
  const inObs = el("textarea", { class: "inp", rows: "2", placeholder: "Observação (opcional)" });
  body.appendChild(el("div", { class: "field" }, [el("label", { class: "f", text: "Observação" }), inObs]));

  openSheet({
    title: "Registrar entrada ou saída",
    subtitle: "Rápido — não precisa estar ligado a um cadastro",
    body: body, focus: false,
    actions: [
      { label: "Cancelar", onClick: closeSheet },
      { label: "Salvar", kind: "btn-primary", onClick: async () => {
        const desc = inDesc.value.trim();
        if (!desc) { toast("Descreva o item"); return; }
        const m = {
          id: uid(), ts: nowISO(), tipo: tipo,
          descricao: desc, quantidade: num(inQtd.value), unidade: inUnid.value.trim(),
          benId: inBen.value.trim(), benNome: inNomeBen.value.trim(), obs: inObs.value.trim(),
          by: state.userId || ""
        };
        await Store.saveMov(m);
        closeSheet(); toast(tipo === "ENTRADA" ? "Entrada registrada" : "Saída registrada"); render();
      } }
    ]
  });
}
function sheetVerMovimento(m) {
  const body = el("div", {}, [
    el("div", { class: "row", style: "margin-bottom:10px" }, [
      tag(m.tipo === "ENTRADA" ? "tag-fralda" : "tag-dieta", m.tipo === "ENTRADA" ? "ENTRADA" : "SAÍDA"),
      el("span", { class: "small muted", text: fmtDT(m.ts) })
    ]),
    el("p", { style: "margin:0 0 8px;font-weight:600", text: m.descricao + (m.quantidade ? (" — " + m.quantidade + (m.unidade ? (" " + m.unidade) : "")) : "") }),
    m.benNome ? el("p", { class: "small muted", style: "margin:0 0 8px", text: "Beneficiário: " + (m.benId ? ("#" + m.benId + " ") : "") + m.benNome }) : null,
    m.obs ? el("p", { class: "small muted", style: "margin:0", text: m.obs }) : null
  ]);
  openSheet({
    title: "Registro avulso", body: body,
    actions: [
      { label: "Excluir", kind: "btn-danger", onClick: () => {
        confirmar("Excluir este registro?", "Não é possível desfazer.", async () => {
          await Store.delMov(m.id); closeSheet(); toast("Registro excluído"); render();
        }, "Excluir");
      } },
      { label: "Fechar", kind: "btn-primary", onClick: closeSheet }
    ]
  });
}

/* ------------------------------------------------------------- RELATÓRIO
   Junta o que entrou/saiu hoje — tanto pela conferência/entrega
   estruturada quanto pelos registros avulsos — num Excel de um clique. */
async function exportarRelatorioDiario() {
  if (typeof XLSX === "undefined") { toast("Biblioteca de Excel indisponível."); return; }
  const entradasVol = entradasHojeEstruturadas(), saidasVol = saidasHojeEstruturadas();
  const movs = movimentosHoje();
  const entradasMov = movs.filter(m => m.tipo === "ENTRADA"), saidasMov = movs.filter(m => m.tipo === "SAIDA");
  if (!entradasVol.length && !saidasVol.length && !movs.length) { toast("Nada registrado hoje ainda."); return; }

  const linhasEntrada = [];
  entradasVol.forEach(v => {
    const b = state.ben[v.benKey] || {};
    (v.itens && v.itens.length ? v.itens : [{}]).forEach(i => linhasEntrada.push({
      "Hora": fmtDT(v.recebidoEm), "Beneficiário": "#" + v.benId + " " + (b.nome || v.benNome || ""),
      "Categoria": v.categoria, "Item": [i.item, i.marca, i.tamanho, i.tipo].filter(Boolean).join(" "),
      "Quantidade": i.qtdRecebida || i.qtdPrevista || "", "Local": v.local || "", "Origem": "Conferência"
    }));
  });
  entradasMov.forEach(m => linhasEntrada.push({
    "Hora": fmtDT(m.ts), "Beneficiário": m.benNome ? ("#" + (m.benId || "") + " " + m.benNome) : "",
    "Categoria": "", "Item": m.descricao, "Quantidade": m.quantidade + (m.unidade ? (" " + m.unidade) : ""),
    "Local": "", "Origem": "Registro avulso" + (m.obs ? (" — " + m.obs) : "")
  }));

  const linhasSaida = [];
  saidasVol.forEach(v => {
    const b = state.ben[v.benKey] || {};
    (v.itens && v.itens.length ? v.itens : [{}]).forEach(i => linhasSaida.push({
      "Hora": fmtDT(v.entregueEm), "Beneficiário": "#" + v.benId + " " + (b.nome || v.benNome || ""),
      "Categoria": v.categoria, "Item": [i.item, i.marca, i.tamanho, i.tipo].filter(Boolean).join(" "),
      "Quantidade": i.qtdRecebida || i.qtdPrevista || "", "Retirado por": v.retiradoPor || "", "Origem": "Entrega"
    }));
  });
  saidasMov.forEach(m => linhasSaida.push({
    "Hora": fmtDT(m.ts), "Beneficiário": m.benNome ? ("#" + (m.benId || "") + " " + m.benNome) : "",
    "Categoria": "", "Item": m.descricao, "Quantidade": m.quantidade + (m.unidade ? (" " + m.unidade) : ""),
    "Retirado por": "", "Origem": "Registro avulso" + (m.obs ? (" — " + m.obs) : "")
  }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhasEntrada), "Entradas");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhasSaida), "Saídas");
  const nome = "relatorio_diario_" + hojeArquivo() + ".xlsx";
  const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  await baixar(nome, new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
}

function importarPlanilha() {
  if (typeof XLSX === "undefined") { toast("Biblioteca de Excel não carregou. Recarregue a página."); return; }
  const inp = el("input", { type: "file", accept: ".xlsx,.xls,.csv,.xlsm", style: "display:none" });
  inp.addEventListener("change", async () => {
    const f = inp.files && inp.files[0]; inp.remove();
    if (!f) return;
    try {
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(new Uint8Array(buf), { type: "array", cellDates: true });
      telaMapeamento(wb, f.name);
    } catch (e) { toast("Não consegui abrir o arquivo."); }
  });
  document.body.appendChild(inp); inp.click();
}

function telaMapeamento(wb, fname) {
  let aba = wb.SheetNames[0];
  const body = el("div");
  const host = el("div");

  const selAba = el("select", { class: "inp" }, wb.SheetNames.map(n => el("option", { value: n, text: n })));
  selAba.addEventListener("change", () => { aba = selAba.value; desenha(); });
  body.appendChild(el("div", { class: "field" }, [el("label", { class: "f", text: "Aba da planilha" }), selAba]));
  body.appendChild(host);

  let mapa = {}, linhas = [], cabec = [], headerRow = 0;

  function desenha() {
    host.innerHTML = "";
    const grade = XLSX.utils.sheet_to_json(wb.Sheets[aba], { header: 1, raw: false, defval: "" });
    headerRow = detectaCabecalho(grade);
    cabec = (grade[headerRow] || []).map((c, i) => String(c || "").trim() || "Coluna " + (i + 1));
    linhas = grade.slice(headerRow + 1).filter(r => r.some(c => String(c || "").trim() !== ""));
    mapa = autoMapeia(cabec);
    tentaAcharColunaDeNumero(grade, headerRow, mapa);

    host.appendChild(el("div", { class: "banner info", style: "margin-bottom:12px" },
      [linhas.length + " linha(s) de dados encontradas. Confira as colunas abaixo."]));

    CAMPOS.forEach(c => {
      const sel = el("select", { class: "inp" }, [el("option", { value: "", text: "— não usar —" })]
        .concat(cabec.map((h, i) => el("option", { value: String(i), text: h, selected: String(mapa[c.k]) === String(i) }))));
      sel.addEventListener("change", () => { mapa[c.k] = sel.value === "" ? null : parseInt(sel.value, 10); });
      host.appendChild(el("div", { class: "field" }, [
        el("label", { class: "f", text: c.rot + (c.req ? " *" : "") }), sel
      ]));
    });
  }
  desenha();

  openSheet({
    title: "Importar planilha", subtitle: fname, body: body, focus: false,
    actions: [
      { label: "Cancelar", onClick: closeSheet },
      { label: "Importar", kind: "btn-primary", onClick: () => {
        if (mapa.benId == null) { toast("Escolha a coluna do número do beneficiário"); return; }
        const tokensCabecalho = new Set(cabec.map(h => norm(h)).filter(Boolean));
        processaImportacao(linhas, mapa, tokensCabecalho);
      } }
    ]
  });
}

function detectaCabecalho(grade) {
  let melhor = 0, score = -1;
  for (let i = 0; i < Math.min(grade.length, 20); i++) {
    const r = grade[i] || [];
    const cheias = r.filter(c => String(c || "").trim() !== "").length;
    const txt = norm(r.join(" "));
    let s = cheias;
    if (/NOME|BENEFICI|PACIENTE/.test(txt)) s += 6;
    if (/ITEM|PRODUTO|MARCA|QUANT|QTD/.test(txt)) s += 4;
    if (s > score) { score = s; melhor = i; }
  }
  return melhor;
}
/* Bate um rótulo (hint) contra um cabeçalho normalizado exigindo palavra
   inteira — não basta a sequência de letras aparecer no meio de outra
   palavra (ex.: "IDADE" não deve casar com "QUANTIDADE"). */
function casaRotulo(h, hint) {
  if (h === hint) return true;
  if (hint.length <= 2) return false;
  const re = new RegExp("(^|[^A-Z0-9])" + hint.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "([^A-Z0-9]|$)");
  return re.test(h);
}
function autoMapeia(cabec) {
  const m = {};
  const usados = {};
  const heads = cabec.map(h => norm(h));
  CAMPOS.forEach(c => {
    for (let i = 0; i < heads.length; i++) {
      if (usados[i]) continue;
      const h = heads[i];
      if (!h) continue;
      const bate = c.hints.some(x => casaRotulo(h, x));
      if (bate) { m[c.k] = i; usados[i] = true; return; }
    }
    m[c.k] = null;
  });
  return m;
}
/* Quando a coluna do número do beneficiário não tem um cabeçalho
   reconhecível (planilhas reais às vezes deixam essa coluna sem título),
   procura, entre as colunas ainda não usadas, uma cujos valores pareçam
   uma sequência de números — e assume que é o "Nº". */
function tentaAcharColunaDeNumero(grade, headerRow, mapa) {
  if (mapa.benId != null) return mapa;
  const usadas = {};
  for (const k in mapa) if (mapa[k] != null) usadas[mapa[k]] = true;
  const nCols = (grade[headerRow] || []).length;
  for (let c = 0; c < nCols; c++) {
    if (usadas[c]) continue;
    let vistos = 0, numericos = 0;
    for (let r = headerRow + 1; r < grade.length && vistos < 40; r++) {
      const v = String((grade[r] || [])[c] || "").trim();
      if (!v) continue;
      vistos++;
      if (/^\d+$/.test(v)) numericos++;
    }
    if (vistos >= 5 && numericos / vistos >= 0.7) { mapa.benId = c; break; }
  }
  return mapa;
}

async function processaImportacao(linhas, mapa, tokensCabecalho) {
  tokensCabecalho = tokensCabecalho || new Set();
  const pega = (r, k) => (mapa[k] == null ? "" : String(r[mapa[k]] == null ? "" : r[mapa[k]]).trim());
  /* Planilhas reais às vezes trazem, no meio dos dados, uma linha de
     título de seção (ex.: "ACIMA DE 12 ANOS") ou o cabeçalho repetido
     (quando a planilha tem mais de um bloco/compra). Nenhuma das duas é
     um beneficiário de verdade — se não forem descartadas, "contaminam"
     o número/nome que as linhas seguintes herdam por arrasto. */
  function linhaEhUtil(r) {
    /* Rede de segurança: um título de seção/divisor de planilha (ex.:
       "ACIMA DE 12 ANOS") às vezes cai justamente na coluna do número ou
       do nome. Um beneficiário de verdade nunca tem um texto tão comprido
       ou com espaçamento de título centralizado ali — se acontecer,
       trata como lixo e descarta, não importa em qual linha apareça. */
    const rawBenId = pega(r, "benId"), rawNome = pega(r, "nome");
    if (pareceTextoDeTitulo(rawBenId) || pareceTextoDeTitulo(rawNome)) return false;
    const temItem = pega(r, "item") || pega(r, "marca") || pega(r, "tamanho") || pega(r, "qtdPrevista") || pega(r, "categoria");
    if (!temItem) return false;
    if (tokensCabecalho.size) {
      let bate = 0;
      ["nome", "item", "categoria", "marca", "tamanho", "tipo"].forEach(k => {
        if (mapa[k] == null) return;
        const v = norm(pega(r, k));
        if (v && tokensCabecalho.has(v)) bate++;
      });
      if (bate >= 2) return false;
    }
    return true;
  }

  const pacotes = Object.create(null);
  const resolvidos = Object.create(null);  // "numero|nomeNorm" -> objeto beneficiário (existente ou novo)
  let ignoradas = 0;
  let ultimoId = "", ultimoNome = "";

  function resolveBen(numero, nome) {
    const rk = norm(numero) + "|" + norm(nome || "");
    if (resolvidos[rk]) return resolvidos[rk];
    let b = encontraBeneficiario(numero, nome);
    if (b) {
      if (nome && !b.nome) b = Object.assign({}, b, { nome: nome });
    } else {
      b = { id: benKey(numero, nome), numero: numero, nome: nome || "", nascimento: "", idade: "", obs: "" };
    }
    resolvidos[rk] = b;
    return b;
  }

  linhas.forEach(r => {
    if (!linhaEhUtil(r)) { ignoradas++; return; }
    let benId = pega(r, "benId");
    let nome = pega(r, "nome");
    /* planilhas costumam repetir o beneficiário só na primeira linha do
       bloco — número E nome em branco ao mesmo tempo é exatamente o
       formato normal de uma linha de item extra, não motivo pra ignorar */
    if (!benId) benId = ultimoId; else ultimoId = benId;
    if (!nome) nome = ultimoNome; else ultimoNome = nome;
    if (!benId) { ignoradas++; return; }
    benId = benId.replace(/[^\w\-.]/g, "");

    const ben = resolveBen(benId, nome);
    const nasc = dataISO(pega(r, "nascimento")); const idade = pega(r, "idade");
    if (nasc && !ben.nascimento) ben.nascimento = nasc;
    if (idade && !ben.idade) ben.idade = idade;

    const item = pega(r, "item");
    const catRaw = pega(r, "categoria");
    const cat = catRaw ? (norm(catRaw).indexOf("FRALD") >= 0 ? "FRALDA" : "DIETA") : inferCat(item + " " + pega(r, "marca") + " " + pega(r, "tipo"));
    const vn = Math.max(1, parseInt(String(pega(r, "volNum")).replace(/\D+/g, ""), 10) || 1);
    const vt = Math.max(vn, parseInt(String(pega(r, "volTotal")).replace(/\D+/g, ""), 10) || vn);

    const key = ben.id + "|" + cat + "|" + vn;
    if (!pacotes[key]) pacotes[key] = { ben: ben, categoria: cat, volNum: vn, volTotal: vt, local: pega(r, "local"), validade: dataISO(pega(r, "validade")), itens: [] };
    pacotes[key].volTotal = Math.max(pacotes[key].volTotal, vt);
    if (item || pega(r, "marca") || pega(r, "qtdPrevista")) {
      pacotes[key].itens.push({
        item: item || cat, marca: pega(r, "marca"), tamanho: pega(r, "tamanho"),
        tipo: pega(r, "tipo"), qtdPrevista: num(pega(r, "qtdPrevista")), qtdRecebida: 0
      });
    }
  });

  const chaves = Object.keys(pacotes);
  const novos = [], atualizados = [];
  chaves.forEach(k => {
    const p = pacotes[k];
    const id = volId(state.competencia, p.ben.id, p.categoria, p.volNum);
    const ex = state.vol[id];
    if (ex) {
      const c = Object.assign({}, ex);
      c.benNome = p.ben.nome || ex.benNome;
      c.benKey = p.ben.id;
      c.volTotal = Math.max(ex.volTotal, p.volTotal);
      if (!c.local && p.local) c.local = p.local;
      if (p.validade) c.validade = p.validade;
      if (ex.status === "AGUARDANDO") {
        /* ainda não recebido: a planilha nova vale por inteiro */
        c.itens = p.itens.length ? p.itens : ex.itens;
      } else {
        /* já conferido/guardado/entregue: nunca mexe no que foi confirmado
           fisicamente (qtd recebida, status, local) — só atualiza a previsão */
        c.itens = mergeItensPrevistos(ex.itens, p.itens);
      }
      push(c, "IMPORTAÇÃO", "planilha atualizada");
      atualizados.push(c);
    } else {
      const v = novoVolume({ benKey: p.ben.id, benId: p.ben.numero, benNome: p.ben.nome, categoria: p.categoria, volNum: p.volNum, volTotal: p.volTotal });
      v.id = id; v.itens = p.itens; v.local = p.local; v.validade = p.validade;
      push(v, "IMPORTAÇÃO", "");
      novos.push(v);
    }
  });

  const bensParaSalvar = Object.keys(resolvidos).map(k => resolvidos[k]);
  const prog = el("div", { class: "empty" }, [el("span", { class: "spin" }), el("div", { class: "small", style: "margin-top:10px", text: "Gravando…" })]);
  const linha = prog.querySelector(".small");
  openSheet({ title: "Importando", body: prog });

  for (const b of bensParaSalvar) await garanteBeneficiarioCompleto(b);
  await Store.saveMany(novos.concat(atualizados), (i, t) => { linha.textContent = "Gravando volume " + i + " de " + t + "…"; });

  closeSheet();
  openSheet({
    title: "Importação concluída",
    body: el("div", {}, [
      el("div", { class: "kpis" }, [
        kpi(novos.length, "volumes novos", "good"),
        kpi(atualizados.length, "atualizados"),
        kpi(bensParaSalvar.length, "pessoas na planilha"),
        kpi(ignoradas, "linhas ignoradas")
      ]),
      el("p", { class: "small muted", style: "margin-top:12px", text: "Volumes já conferidos mantêm quantidade recebida, local e situação — só a previsão é atualizada. Número repetido com nome diferente é cadastrado como pessoa nova." })
    ]),
    actions: [{ label: "Ver lista de conferência", kind: "btn-primary", onClick: () => { closeSheet(); state.tab = "conferir"; state.conferFilter = "PENDENTES"; render(); } }]
  });
  render();
}
/* Atualiza a quantidade prevista dos itens já existentes (por
   item+marca+tamanho+tipo) e acrescenta itens novos sem mexer no que já
   foi recebido. */
function mergeItensPrevistos(existentes, novosItens) {
  const out = (existentes || []).map(i => Object.assign({}, i));
  (novosItens || []).forEach(ni => {
    const chave = norm([ni.item, ni.marca, ni.tamanho, ni.tipo].join("|"));
    const alvo = out.find(i => norm([i.item, i.marca, i.tamanho, i.tipo].join("|")) === chave);
    if (alvo) alvo.qtdPrevista = ni.qtdPrevista;
    else out.push(Object.assign({}, ni, { qtdRecebida: 0 }));
  });
  return out;
}
async function garanteBeneficiarioCompleto(b) {
  const ex = state.ben[b.id];
  const merged = Object.assign({}, ex || {}, {
    id: b.id,
    numero: b.numero,
    nome: b.nome || (ex && ex.nome) || "",
    nascimento: b.nascimento || (ex && ex.nascimento) || "",
    idade: b.idade || (ex && ex.idade) || "",
    obs: (ex && ex.obs) || ""
  });
  await Store.saveBen(merged);
}
/* Texto de título/observação (não uma pessoa nem um número de verdade):
   comprido demais, ou com aquele espaçamento largo de texto centralizado
   que planilhas usam pra "sublinhar" um título entre colunas. */
function pareceTextoDeTitulo(txt) {
  if (!txt) return false;
  const t = String(txt).trim();
  if (t.length > 55) return true;
  if (/\s{3,}/.test(txt)) return true;
  return false;
}
function dataISO(s) {
  if (!s) return "";
  const t = String(s).trim();
  let m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) {
    let a = m[3].length === 2 ? "19" + m[3] : m[3];
    if (m[3].length === 2 && parseInt(m[3], 10) < 30) a = "20" + m[3];
    return a + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0");
  }
  m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[0];
  const d = new Date(t);
  return isNaN(d) ? "" : d.toISOString().slice(0, 10);
}

/* ------------------------------------------------------------- EXPORTAÇÃO */
/* ------------------------------------------------------- FORMATAÇÃO XLSX
   Reproduz o padrão da planilha que a equipe já está acostumada a ler:
   Nº e Nome mesclados por pessoa, uma linha por item, FRALDA destacada. */
const XLS_COR = { cabecalho: "305496", fralda: "FFF2CC", titulo: "1F3864" };
function xlsCel(v, style, tipo) {
  const t = tipo || (typeof v === "number" ? "n" : "s");
  const o = { v: (v === undefined || v === null) ? "" : v, t: t };
  if (style) o.s = style;
  return o;
}
function montaLinhasConferencia(vols) {
  const porPessoa = Object.create(null);
  vols.forEach(v => {
    const bk = v.benKey || benKey(v.benId, v.benNome || "");
    if (!porPessoa[bk]) {
      const b = state.ben[bk];
      porPessoa[bk] = { bk: bk, benId: v.benId, nome: (b && b.nome) || v.benNome || "", vols: [] };
    }
    porPessoa[bk].vols.push(v);
  });
  const pessoas = Object.values(porPessoa);
  pessoas.sort((a, b) => {
    const na = parseInt(a.benId, 10), nb = parseInt(b.benId, 10);
    if (isFinite(na) && isFinite(nb) && na !== nb) return na - nb;
    const byNum = String(a.benId).localeCompare(String(b.benId), "pt-BR", { numeric: true });
    return byNum !== 0 ? byNum : a.nome.localeCompare(b.nome, "pt-BR");
  });

  const linhas = [];
  pessoas.forEach(p => {
    p.vols.sort((a, b) => (a.categoria === b.categoria ? a.volNum - b.volNum : (a.categoria === "FRALDA" ? -1 : 1)));
    const inicio = linhas.length;
    p.vols.forEach(v => {
      const itens = (v.itens && v.itens.length) ? v.itens : [{ item: v.categoria, marca: "", tamanho: "", tipo: "", qtdPrevista: 0, qtdRecebida: 0 }];
      itens.forEach(it => {
        let entregue = "";
        if (v.status === "DIVERGENTE") entregue = "DIVERGÊNCIA" + (v.obs ? (": " + v.obs) : "");
        else if (v.status === "INCOMPLETO") entregue = "INCOMPLETO";
        else if (v.status !== "AGUARDANDO") entregue = it.qtdRecebida ? ("ENTREGUE " + it.qtdRecebida) : "ENTREGUE";
        linhas.push({
          benId: p.benId, nome: p.nome, categoria: v.categoria,
          marca: it.marca || "", tamanho: it.tamanho || "", tipo: it.tipo || "",
          qtd: it.qtdPrevista || 0, entregue: entregue, local: v.local || ""
        });
      });
    });
    p.faixa = linhas.length > inicio ? [inicio, linhas.length - 1] : null;
  });
  return { linhas: linhas, pessoas: pessoas };
}
function planilhaConferenciaFormatada(vols, titulo) {
  const { linhas, pessoas } = montaLinhasConferencia(vols);
  const estCab = { font: { bold: true, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: XLS_COR.cabecalho } }, alignment: { horizontal: "center", vertical: "center", wrapText: true } };
  const estTitulo = { font: { bold: true, sz: 13, color: { rgb: XLS_COR.titulo } } };
  const aoa = [];
  aoa.push([xlsCel(titulo, estTitulo)]);
  aoa.push([]);
  aoa.push(["Nº", "NOME", "ITEM", "MARCA", "TAMANHO", "TIPO", "QUANTIDADE/MÊS", "ENTREGUE", "LOCAL"].map(h => xlsCel(h, estCab)));
  const linhaCabecalho = 2; // índice 0-based da linha de cabeçalho no aoa

  linhas.forEach(ln => {
    const fundo = ln.categoria === "FRALDA" ? { fill: { fgColor: { rgb: XLS_COR.fralda } } } : {};
    const estNumNome = Object.assign({ font: { bold: true }, alignment: { vertical: "center" } }, fundo);
    aoa.push([
      xlsCel("", estNumNome, "s"),
      xlsCel("", estNumNome, "s"),
      xlsCel(ln.categoria, fundo),
      xlsCel(ln.marca, fundo),
      xlsCel(ln.tamanho, fundo),
      xlsCel(ln.tipo, fundo),
      xlsCel(ln.qtd, Object.assign({ alignment: { horizontal: "center" } }, fundo), "n"),
      xlsCel(ln.entregue, fundo),
      xlsCel(ln.local, fundo)
    ]);
  });

  const merges = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 8 } }];
  pessoas.forEach(p => {
    if (!p.faixa) return;
    const rIni = linhaCabecalho + 1 + p.faixa[0];
    const rFim = linhaCabecalho + 1 + p.faixa[1];
    const numVal = /^\d+$/.test(String(p.benId)) ? parseInt(p.benId, 10) : p.benId;
    aoa[rIni][0].v = numVal; aoa[rIni][0].t = typeof numVal === "number" ? "n" : "s";
    aoa[rIni][1].v = p.nome; aoa[rIni][1].t = "s";
    if (rFim > rIni) {
      merges.push({ s: { r: rIni, c: 0 }, e: { r: rFim, c: 0 } });
      merges.push({ s: { r: rIni, c: 1 }, e: { r: rFim, c: 1 } });
    }
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!merges"] = merges;
  ws["!cols"] = [{ wch: 6 }, { wch: 32 }, { wch: 9 }, { wch: 30 }, { wch: 11 }, { wch: 13 }, { wch: 15 }, { wch: 18 }, { wch: 20 }];
  ws["!rows"] = [{ hpt: 20 }];
  return ws;
}

async function exportar(tipo) {
  if (typeof XLSX === "undefined") { toast("Biblioteca de Excel indisponível."); return; }
  const vols = Object.keys(state.vol).map(k => state.vol[k]).sort((a, b) =>
    (parseInt(a.benId, 10) || 0) - (parseInt(b.benId, 10) || 0) || a.categoria.localeCompare(b.categoria) || a.volNum - b.volNum);
  const filtrados = tipo === "pendencias" ? vols.filter(v => v.status === "AGUARDANDO" || v.status === "DIVERGENTE" || !v.local) : vols;
  if (!filtrados.length) { toast("Nada para exportar" + (tipo === "pendencias" ? " — sem pendências." : " nesta competência.")); return; }

  const linhasItens = [];
  filtrados.forEach(v => {
    const b = state.ben[v.benKey] || {};
    (v.itens || []).forEach(i => linhasItens.push({
      "Nº": v.benId, "Beneficiário": b.nome || v.benNome || "", "Categoria": v.categoria, "Volume": v.volNum + "/" + v.volTotal,
      "Item": i.item, "Marca": i.marca, "Tamanho": i.tamanho, "Tipo": i.tipo,
      "Qtd prevista": i.qtdPrevista || 0, "Qtd recebida": i.qtdRecebida || 0,
      "Diferença": (i.qtdRecebida || 0) - (i.qtdPrevista || 0), "Local": v.local || "", "Situação": (STATUS[v.status] || {}).label || v.status
    }));
  });
  const g = grupos();
  const linhasGrupo = Object.keys(g).map(k => {
    const o = g[k], b = state.ben[o.benKey] || {};
    return { "Nº": o.benId, "Beneficiário": b.nome || o.benNome || "", "Categoria": o.categoria, "Volumes recebidos": o.recebidos, "Volumes previstos": o.total,
      "Faltando": o.faltando, "Locais": o.locais.join(" | "), "Entregues": o.entregues };
  }).sort((a, b) => (parseInt(a["Nº"], 10) || 0) - (parseInt(b["Nº"], 10) || 0));

  const titulo = "CONFERÊNCIA — " + compLabel(state.competencia) + (tipo === "pendencias" ? " — PENDÊNCIAS" : "");
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, planilhaConferenciaFormatada(filtrados, titulo), "Conferência");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhasItens), "Itens (detalhado)");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhasGrupo), "Resumo por pacote");

  const nome = (tipo === "pendencias" ? "pendencias_" : "conferencia_") + state.competencia + "_" + hojeArquivo() + ".xlsx";
  const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  await baixar(nome, new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
}

async function baixar(filename, blob) {
  if (CAP.downloads) {
    try { await CAP.downloads.save({ filename: filename, data: blob }); toast("Arquivo salvo"); return; }
    catch (e) {
      if (e && e.code === "declined") return;
      if (e && e.code === "rate_limited") { toast("Aguarde um instante e tente de novo."); return; }
    }
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = el("a", { href: url, download: filename });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { toast("Não foi possível baixar o arquivo aqui."); }
}

/* ------------------------------------------------------------- ETIQUETAS */
function telaEtiquetas() {
  const selCat = el("select", { class: "inp" }, [el("option", { value: "", text: "Todas as categorias" })].concat(CATS.map(c => el("option", { value: c, text: c }))));
  const selSt = el("select", { class: "inp" }, [el("option", { value: "", text: "Todas as situações" })].concat(STATUS_ORDER.map(s => el("option", { value: s, text: STATUS[s].label }))));
  openSheet({
    title: "Etiquetas com QR",
    body: el("div", {}, [
      el("p", { class: "small muted", style: "margin:0 0 11px", text: "Uma etiqueta por volume, com número, nome, conteúdo e QR. Cole na caixa e a conferência passa a ser um toque." }),
      el("div", { class: "grid2 field" }, [
        el("div", {}, [el("label", { class: "f", text: "Categoria" }), selCat]),
        el("div", {}, [el("label", { class: "f", text: "Situação" }), selSt])
      ])
    ]),
    focus: false,
    actions: [
      { label: "Cancelar", onClick: closeSheet },
      { label: "Gerar e imprimir", kind: "btn-primary", onClick: () => { closeSheet(); geraEtiquetas(selCat.value, selSt.value); } }
    ]
  });
}

function geraEtiquetas(cat, st) {
  const vols = Object.keys(state.vol).map(k => state.vol[k])
    .filter(v => (!cat || v.categoria === cat) && (!st || v.status === st))
    .sort((a, b) => (parseInt(a.benId, 10) || 0) - (parseInt(b.benId, 10) || 0) || a.volNum - b.volNum);
  if (!vols.length) { toast("Nenhum volume com esse filtro."); return; }

  const area = $("#printarea");
  area.innerHTML = "";
  const sheetEl = el("div", { class: "lblsheet" });
  vols.forEach(v => {
    const b = state.ben[v.benKey] || {};
    const qrBox = el("div", { class: "lqr" });
    const itens = (v.itens || []).map(i => [i.item, i.marca, i.tamanho, i.tipo, i.qtdPrevista ? "x" + i.qtdPrevista : ""].filter(Boolean).join(" ")).join("<br>");
    sheetEl.appendChild(el("div", { class: "lbl" }, [
      qrBox,
      el("div", { class: "lid", text: String(v.benId) }),
      el("div", { class: "lname", text: (b.nome || v.benNome || "").slice(0, 44) }),
      el("div", {}, [el("span", { class: "lcat", text: v.categoria + " · VOL " + v.volNum + "/" + v.volTotal })]),
      el("div", { class: "litems", html: itens || "&nbsp;" }),
      el("div", { class: "litems", html: "<b>Local:</b> " + esc(v.local || "__________") + " &nbsp; <b>Comp.:</b> " + esc(compLabel(v.competencia)) })
    ]));
    if (typeof QRCode !== "undefined") {
      try { new QRCode(qrBox, { text: "ALMOX|" + v.id, width: 96, height: 96, correctLevel: QRCode.CorrectLevel.M }); }
      catch (e) {}
    }
  });
  area.appendChild(sheetEl);
  setTimeout(() => { try { window.print(); } catch (e) { toast("Use o menu do navegador para imprimir."); } }, 350);
}

/* --------------------------------------------------------- COMPETÊNCIAS */
function novaCompetencia() {
  const inp = el("input", { class: "inp inp-lg", type: "month", value: todayCompetencia() });
  openSheet({
    title: "Nova competência",
    body: el("div", {}, [el("label", { class: "f", text: "Mês de referência" }), inp]),
    actions: [
      { label: "Cancelar", onClick: closeSheet },
      { label: "Criar e abrir", kind: "btn-primary", onClick: async () => {
        const c = inp.value; if (!c) return;
        if (state.competencias.indexOf(c) < 0) state.competencias.push(c);
        state.competencia = c;
        await Store.saveConfig();
        closeSheet(); trocaCompetencia(c);
      } }
    ]
  });
}
function copiarCompetencia() {
  const outras = state.competencias.filter(c => c !== state.competencia).sort().reverse();
  if (!outras.length) { toast("Não há outra competência para copiar."); return; }
  const sel = el("select", { class: "inp" }, outras.map(c => el("option", { value: c, text: compLabel(c) })));
  openSheet({
    title: "Copiar lista de volumes",
    body: el("div", {}, [
      el("p", { class: "small muted", style: "margin:0 0 11px", text: "Cria os mesmos volumes em " + compLabel(state.competencia) + ", zerados e aguardando recebimento." }),
      el("label", { class: "f", text: "Copiar de" }), sel
    ]),
    actions: [
      { label: "Cancelar", onClick: closeSheet },
      { label: "Copiar", kind: "btn-primary", onClick: async () => { closeSheet(); await copiaDe(sel.value); } }
    ]
  });
}
async function copiaDe(origem) {
  if (!CAP.db && state.mode !== "local") { toast("Indisponível."); return; }
  openSheet({ title: "Copiando…", body: el("div", { class: "empty" }, [el("span", { class: "spin" })]) });
  let fonte = [];
  if (state.mode === "nuvem" && CAP.db) {
    try {
      const snap = await CAP.db.collection("volumes").where("competencia", "==", origem).limit(1000).get();
      fonte = snap.docs.map(d => d.data());
    } catch (e) { closeSheet(); toast("Falha ao ler a competência de origem."); return; }
  } else {
    fonte = Object.keys(Store.all.vol).map(k => Store.all.vol[k]).filter(v => v.competencia === origem);
  }
  const novos = fonte.map(o => {
    const bk = o.benKey || benKey(o.benId, o.benNome || "");
    const v = novoVolume({ benKey: bk, benId: o.benId, benNome: o.benNome, categoria: o.categoria, volNum: o.volNum, volTotal: o.volTotal });
    v.id = volId(state.competencia, bk, o.categoria, o.volNum);
    v.itens = (o.itens || []).map(i => ({ item: i.item, marca: i.marca, tamanho: i.tamanho, tipo: i.tipo, qtdPrevista: i.qtdPrevista, qtdRecebida: 0 }));
    push(v, "CÓPIA", "de " + compLabel(origem));
    return v;
  }).filter(v => !state.vol[v.id]);
  await Store.saveMany(novos);
  closeSheet(); toast(novos.length + " volumes copiados"); render();
}
function apagarCompetencia() {
  const n = Object.keys(state.vol).length;
  if (!n) { toast("Nada para apagar."); return; }
  confirmar("Apagar " + n + " volumes?", "Todos os volumes de " + compLabel(state.competencia) + " serão removidos, com histórico. Os beneficiários continuam cadastrados.", async () => {
    openSheet({ title: "Apagando…", body: el("div", { class: "empty" }, [el("span", { class: "spin" })]) });
    for (const id of Object.keys(state.vol)) await Store.delVol(id);
    closeSheet(); toast("Competência limpa"); render();
  }, "Apagar tudo");
}
function trocaCompetencia(c) {
  state.competencia = c;
  state.vol = Object.create(null);
  if (state.mode === "nuvem") Store.resubscribe();
  else { Store.localProject(); Store.localSave(); }
  render();
  Store.saveConfig();
}
/* ==========================================================================
   BOOT
   ========================================================================== */
function bindHeader() {
  const q = $("#q");
  let t = null;
  q.addEventListener("input", () => {
    $("#qclear").hidden = !q.value;
    clearTimeout(t);
    t = setTimeout(() => { state.q = q.value.trim(); render(); }, 140);
  });
  q.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      state.q = q.value.trim();
      if (state.tab !== "buscar" && state.tab !== "conferir" && state.tab !== "entregar") state.tab = "buscar";
      render();
      q.blur();
    }
  });
  $("#qclear").addEventListener("click", () => { q.value = ""; state.q = ""; $("#qclear").hidden = true; render(); q.focus(); });

  $("#compPick").addEventListener("change", e => {
    const v = e.target.value;
    if (v === "__nova__") { renderComp(); novaCompetencia(); return; }
    trocaCompetencia(v);
  });

  const saved = (function () { try { return localStorage.getItem("almox.theme"); } catch (e) { return null; } })();
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  $("#themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("almox.theme", next); } catch (e) {}
  });
}

function atualizaSubtitulo() {
  $("#brandsub").textContent = state.mode === "nuvem" ? "sincronizado" : (state.mode === "local" ? "modo local" : "conectando…");
}

async function boot() {
  bindHeader();
  Store.localLoad();          // mostra algo imediatamente
  render();
  atualizaSubtitulo();

  if (!hasClaude) {
    state.mode = "local"; state.ready = true;
    atualizaSubtitulo(); render();
    return;
  }

  /* capacidades secundárias, sem travar a tela */
  window.claude.use("sample").then(s => {
    CAP.sample = s;
    if (s && s.limits) s.limits().then(l => { CAP.sampleImages = l && l.images; }).catch(() => {});
  }).catch(() => {});
  window.claude.use("downloads").then(d => { CAP.downloads = d; }).catch(() => {});
  window.claude.use("user").then(async u => {
    CAP.user = u;
    if (!u) return;
    try { state.userId = await u.id(); } catch (e) {}
    try {
      const can = await u.can("data.write");
      if (can === false) { state.canWrite = false; render(); }
    } catch (e) {}
  }).catch(() => {});

  /* banco: decide o modo */
  let db = null;
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  CAP.db = db;
  if (db) {
    state.mode = "nuvem";
    state.ben = Object.create(null);
    state.vol = Object.create(null);
    Store.resubscribe();
    /* primeira gravação de config garante a existência do documento */
    try {
      const snap = await db.doc("config/app").get();
      if (snap.exists) {
        const o = snap.data() || {};
        if (o.competencia && !state.q) state.competencia = o.competencia;
        state.competencias = Array.isArray(o.competencias) ? o.competencias.slice() : [];
        state.locais = Array.isArray(o.locais) ? o.locais : [];
        if (state.competencias.indexOf(state.competencia) < 0) state.competencias.push(state.competencia);
        Store.resubscribe();
      } else {
        state.competencias = [state.competencia];
        await Store.saveConfig();
      }
    } catch (e) { /* segue com os padrões */ }
  } else {
    state.mode = "local";
  }
  state.ready = true;
  atualizaSubtitulo();
  render();
}

window.addEventListener("beforeprint", () => {});
window.addEventListener("afterprint", () => { $("#printarea").innerHTML = ""; });

boot();

</script>
